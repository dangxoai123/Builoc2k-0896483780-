<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng Nhập - MMoPanel</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta property="og:title" content="MMoPanel - Dịch vụ tăng tương tác mạng xã hội">
<meta property="og:description" content="Nền tảng tăng follow, like, view cho Facebook, TikTok, YouTube, Instagram tự động nhanh chóng.">
<meta property="og:image" content="logo.png">
<meta property="og:type" content="website">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="lang.js"></script>
</head>
<body class="auth-body">

<header class="auth-header">
  <a href="index.html" class="nav-logo" style="text-decoration:none;display:flex;align-items:center;gap:8px">
    <img src="logo.png" alt="MMoPanel" style="width:36px;height:36px;border-radius:8px;object-fit:cover">
    MMoPanel
  </a>
  <a href="index.html" class="btn-home-auth">Trang chủ</a>
</header>

<div class="auth-container">
  <div class="auth-left">
    <div class="auth-illustration">
      <div class="social-card">
        <div class="social-avatar">👨‍💻</div>
        <div>
          <div class="social-name">Finn Sword</div>
          <div class="social-user">@finnsword ✓</div>
        </div>
        <button class="follow-btn">Follow</button>
      </div>
      <div class="social-img"><div class="social-img-placeholder">📊</div></div>
      <div class="followers-badge">
        <div class="avatar-sm">🧑</div>
        <span>+1000 New Followers!</span>
      </div>
    </div>
    <h2 class="auth-tagline">Phát triển <span class="highlight" style="font-family:'Dancing Script',cursive">mạng xã<br>hội.</span></h2>
    <a href="services.html" class="btn-svc-auth">Dịch vụ <i class="fas fa-arrow-up-right"></i></a>
  </div>

  <div class="auth-right">
    <div class="auth-form-box">
      <h1 class="auth-title">Đăng Nhập</h1>
      <p class="auth-subtitle">Chào mừng bạn trở lại! Vui lòng đăng nhập.</p>

      <div id="loginError" class="auth-error" style="display:none"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="Nhập địa chỉ email..." required>
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <div class="input-password">
            <input type="password" id="loginPassword" class="form-input" placeholder="Nhập mật khẩu..." required>
            <button type="button" class="eye-btn" onclick="togglePass('loginPassword',this)"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="form-remember">
          <label class="check-label">
            <input type="checkbox" id="rememberMe"> Ghi nhớ đăng nhập
          </label>
          <a href="#" class="forgot-link">Quên mật khẩu?</a>
        </div>
        <button type="submit" class="btn-auth" id="loginBtn">
          <span>Đăng Nhập</span>
        </button>
      </form>

      <p class="auth-switch"><span>Chưa có tài khoản?</span> <a href="signup.html" class="auth-link">Đăng ký ngay</a></p>
    </div>
  </div>
</div>

<script>
// ==========================================
// LOGIN PAGE - Token check
// Nếu đã đăng nhập → vào dashboard
// Nếu ?logout=1 → xóa token và hiện form
// ==========================================
const _lsToken = localStorage.getItem('jwt_token');
const _hasLogout = new URLSearchParams(window.location.search).get('logout');

if (_hasLogout) {
  // Đăng xuất thực sự: xóa token và hiện form
  localStorage.removeItem('jwt_token');
  localStorage.removeItem('user_data');
  sessionStorage.removeItem('jwt_token');
  sessionStorage.removeItem('user_data');
} else if (_lsToken) {
  // Đã ghi nhớ đăng nhập → vào dashboard luôn
  window.location.href = 'dashboard.html';
}

// ==========================================
// GHI NHỚ ĐĂNG NHẬP — Tự điền email/password khi tải trang
// ==========================================
window.addEventListener('DOMContentLoaded', function() {
  const saved = JSON.parse(localStorage.getItem('remember_login') || 'null');
  if (saved && saved.email) {
    document.getElementById('loginEmail').value    = saved.email;
    document.getElementById('loginPassword').value = saved.password;
    document.getElementById('rememberMe').checked  = true;
  }
});

function togglePass(id, btn) {
  const input = document.getElementById(id);
  if (input.type === 'password') {
    input.type = 'text';
    btn.innerHTML = '<i class="fas fa-eye-slash"></i>';
  } else {
    input.type = 'password';
    btn.innerHTML = '<i class="fas fa-eye"></i>';
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const email      = document.getElementById('loginEmail').value.trim();
  const password   = document.getElementById('loginPassword').value;
  const rememberMe = document.getElementById('rememberMe').checked;
  const btn        = document.getElementById('loginBtn');
  const errorBox   = document.getElementById('loginError');

  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang đăng nhập...';
  btn.disabled  = true;
  errorBox.style.display = 'none';

  try {
    const res  = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Đăng nhập thất bại');

    if (rememberMe) {
      // ✅ Ghi nhớ: lưu localStorage → lần sau tự đăng nhập + điền sẵn TK/MK
      localStorage.setItem('jwt_token',      data.token);
      localStorage.setItem('user_data',      JSON.stringify(data.user));
      localStorage.setItem('remember_login', JSON.stringify({ email, password }));
      // Xóa session (tránh trùng)
      sessionStorage.removeItem('jwt_token');
      sessionStorage.removeItem('user_data');
    } else {
      // ❌ Không ghi nhớ: lưu sessionStorage → mất khi đóng tab, lần sau phải nhập lại
      sessionStorage.setItem('jwt_token',  data.token);
      sessionStorage.setItem('user_data',  JSON.stringify(data.user));
      // Xóa localStorage để không bị auto-login
      localStorage.removeItem('jwt_token');
      localStorage.removeItem('user_data');
      localStorage.removeItem('remember_login');
    }

    window.location.href = 'dashboard.html';
  } catch (err) {
    errorBox.textContent   = err.message;
    errorBox.style.display = 'block';
    btn.innerHTML = '<span>Đăng Nhập</span>';
    btn.disabled  = false;
  }
}
</script>
